name: Girassol — compilação manual Android 13+ (APK ARM64 verificado)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: girassol-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Compilar ARM64 Debug + Release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Instalar toolchain declarada
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Preparar compilador de materiais Filament 1.56.0
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 https://github.com/google/filament/releases/download/v1.56.0/filament-v1.56.0-linux.tgz -o "$RUNNER_TEMP/filament.tgz"
          echo '393dcc066987345282f4b5c3f525ab053d9c21087141cdc8015f403cddf455f0  '"$RUNNER_TEMP/filament.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/filament"
          tar -xzf "$RUNNER_TEMP/filament.tgz" --strip-components=1 -C "$RUNNER_TEMP/filament"
          echo "FILAMENT_TOOLS_DIR=$RUNNER_TEMP/filament" >> "$GITHUB_ENV"
      - name: Compilar materiais e shaders
        run: scripts/compile-materials.sh
      - name: Compilar Kotlin, JNI C++ e APKs sem executar testes
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - name: APK Debug ARM64
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: girassol-arm64-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
      - name: APK Release ARM64 assinado para desenvolvimento
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: girassol-arm64-release-dev-signed
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Materiais compilados
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: girassol-filament-materials
          path: |
            app/src/main/assets/materials/
            app/src/main/materials/city.sha256

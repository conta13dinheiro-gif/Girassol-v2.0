name: Girassol Android CI

on:
  push:
    branches:
      - "**"
  # Push already covers PR synchronize events. Keep PR events only for opening/reopening
  # so a single commit does not launch two identical builds.
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: girassol-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Prepare pinned Filament 1.56.0 material compiler
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 https://github.com/google/filament/releases/download/v1.56.0/filament-v1.56.0-linux.tgz -o "$RUNNER_TEMP/filament.tgz"
          echo '393dcc066987345282f4b5c3f525ab053d9c21087141cdc8015f403cddf455f0  '"$RUNNER_TEMP/filament.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/filament"
          tar -xzf "$RUNNER_TEMP/filament.tgz" --strip-components=1 -C "$RUNNER_TEMP/filament"
          echo "FILAMENT_TOOLS_DIR=$RUNNER_TEMP/filament" >> "$GITHUB_ENV"

      - name: Compile Filament materials and shaders
        run: scripts/compile-materials.sh

      - name: Fetch pinned Sherpa-ONNX Android runtime
        run: bash scripts/fetch-sherpa-onnx-aar.sh

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Validate Gradle
        run: ./gradlew --version

      - name: Run native C++ tests with ASan and UBSan
        run: scripts/test-native.sh

      - name: Run unit tests and lint
        id: validation
        continue-on-error: true
        run: ./gradlew test testDebugUnitTest lintDebug --no-daemon

      - name: Build ARM64 debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Stage distributable APKs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/debug dist/release
          mapfile -d '' debug_apks < <(find app/build/outputs/apk/debug -type f -name '*.apk' -print0)
          ((${#debug_apks[@]} > 0)) || { echo "::error::No debug APK was generated"; exit 1; }
          cp "${debug_apks[@]}" dist/debug/
          mapfile -d '' release_apks < <(find app/build/outputs/apk/release -type f -name '*.apk' -print0)
          ((${#release_apks[@]} > 0)) || { echo "::error::No release APK was generated"; exit 1; }
          cp "${release_apks[@]}" dist/release/
          test -n "$(find dist/debug -name '*.apk' -print -quit)"
          test -n "$(find dist/release -name '*.apk' -print -quit)"
          sha256sum dist/debug/*.apk dist/release/*.apk
          for apk in dist/debug/*.apk dist/release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          done

      - name: Publish debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Girassol-debug
          path: dist/debug/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Girassol-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce test and lint gates
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          if [[ "$VALIDATION_OUTCOME" != "success" ]]; then
            echo "::error::Unit tests, Android unit tests or lint failed."
            exit 1
          fi
